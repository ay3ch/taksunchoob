<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طرح‌ها | تکسان چوب</title>
<meta name="description" content="طرح‌ها و رنگ‌های قابل انتخاب برای صفحه کابینت تکسان چوب">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script>document.documentElement.className="js"</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="curtain" id="curtain" aria-hidden="true"><img class="curtain-logo" src="images/logo.png" alt=""></div>
<div id="site-header"></div>
<main>
  <div class="page-title on-dark glowfx">
    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="grain"></div>
    <div class="container">
      <h1 data-split>طرح‌ها</h1>
      <p>طرح‌ها و رنگ‌های قابل انتخاب برای صفحه کابینت</p>
    </div>
  </div>
  <div class="toolbar-wrap">
    <div class="container toolbar">
      <input class="search" id="search" type="search" placeholder="جستجو با کد" aria-label="جستجو با کد">
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <section class="section" style="padding-top:8px">
    <div class="container">
      <div class="count" id="count"></div>
      <div class="designs" id="designs"></div>
      <div class="empty" id="empty" hidden>طرحی با این مشخصات پیدا نشد.</div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="نمایش طرح">
  <div class="box">
    <div class="big" id="lb-img"></div>
    <div class="cap">
      <div><b id="lb-code"></b></div>
      <button class="close" id="lb-close">بستن</button>
    </div>
  </div>
</div>
<div id="site-footer"></div>
<script src="js/designs-data.js"></script>
<script src="js/main.js"></script>
<script src="js/designs.js"></script>
